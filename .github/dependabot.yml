# Standard Dependabot config (mattas-net security standard): monthly, 7-day cooldown,
# one grouped PR per ecosystem. Security updates are separate and stay immediate.
version: 2
updates:
- package-ecosystem: github-actions
  # Root covers .github/workflows; the glob covers the composite actions in .github/actions/*,
  # whose pinned action SHAs Dependabot otherwise never sees.
  directories:
  - /
  - /.github/actions/*
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
      - '*'
