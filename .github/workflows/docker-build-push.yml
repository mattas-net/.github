name: Build and Push Docker Image (reusable)

# Shared by the mattas-net web sites. Callers run it when a GitHub release is
# published (GitHub creates the tag from the release target) or on a manual
# dispatch from an existing tag. The image is pushed to ghcr.io/<owner>/<repo>
# tagged with the release tag, plus `latest` unless the release is a pre-release.
# The OCI source label links the package to the calling repository.
on:
  workflow_call:
    inputs:
      build-args:
        description: Newline-separated KEY=VALUE pairs passed to docker build.
        type: string
        default: ""
      node-version:
        description: Node major used by the verify job (match the Dockerfile base).
        type: string
        default: "22"
      npm-ci-args:
        description: Extra flags for npm ci in the verify job.
        type: string
        default: "--ignore-scripts"
      verify:
        description: Run lint / typecheck / test / audit before building.
        type: boolean
        default: true
      platforms:
        description: Comma-separated platforms to build.
        type: string
        default: linux/amd64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  verify:
    # Only tags map to an image tag; a dispatch from a branch does nothing.
    if: inputs.verify && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci ${{ inputs.npm-ci-args }}

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build-and-push:
    needs: verify
    # always() lets the job run when verify was skipped (inputs.verify=false);
    # a failed verify still blocks the build.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: vars
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
          # On a manual dispatch there is no release payload; treat it as a full release.
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease }}
        run: |
          tags="${IMAGE}:${TAG}"
          if [ "$PRERELEASE" != "true" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.vars.outputs.tags }}
        run: printf 'Pushed %s\n%s\n' "$DIGEST" "$TAGS"
