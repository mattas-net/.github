name: Build and Push Docker Image (reusable)

# Builds a repo's Dockerfile and pushes it to ghcr.io/<owner>/<repo>.
# Two ways in:
#   - a release caller passes `ref` (the tag create-release.yml just made):
#     the tag is checked out and the image is tagged with it;
#   - a manual dispatch from an existing tag (rebuild): no `ref` needed.
# A dispatch from a branch does nothing. `latest` is added unless the tag has a
# pre-release suffix (1.4.2-beta1). The OCI source label links the package to
# the repository.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag to build (empty = the ref this run was dispatched from, which must be a tag).
        type: string
        default: ""
      build-args:
        description: Newline-separated KEY=VALUE pairs passed to docker build.
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms to build (QEMU is set up for non-native ones).
        type: string
        default: linux/amd64
      verify:
        description: Run node-ci.yml (lint / typecheck / test / audit) before building. Set false for non-Node images or when checks already gate main.
        type: boolean
        default: true
      node-version:
        description: Passed to node-ci.yml when verify is true.
        type: string
        default: "22"
      npm-ci-args:
        description: Passed to node-ci.yml when verify is true.
        type: string
        default: "--ignore-scripts"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  verify:
    if: inputs.verify && (inputs.ref != '' || github.ref_type == 'tag')
    uses: mattas-net/.github/.github/workflows/node-ci.yml@main
    permissions:
      contents: read
    with:
      node-version: ${{ inputs.node-version }}
      npm-ci-args: ${{ inputs.npm-ci-args }}

  build-and-push:
    needs: verify
    # always() lets the job run when verify was skipped (inputs.verify=false);
    # a failed verify still blocks the build.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled' && (inputs.ref != '' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine image tags
        id: vars
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REF_INPUT: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_INPUT:-$REF_NAME}"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:${tag}"
          if [[ "$tag" != *-* ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.vars.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.vars.outputs.tags }}
        run: printf 'Pushed %s\n%s\n' "$DIGEST" "$TAGS"
