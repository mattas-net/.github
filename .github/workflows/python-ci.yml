name: Python checks (reusable)

# Lint, format-check, type-check, test and build a Python project, then audit its
# dependencies. Ruff is the standard linter and formatter (Home Assistant core's
# toolset), so `install` must put ruff on the path. Callers run this on push to
# main (automatic) and on pull requests behind their `approve` gate.
#
# Outputs:
#   checks-result    "success" when every python-versions leg of the checks job passed
#                    (aggregated by the matrix-result job)
#   security-result  "success" when the security job passed, and fuzz too when it runs (fuzz true, pull_request)
#                    (fuzz: ClusterFuzzLite over the caller's .clusterfuzzlite/ atheris targets,
#                    code-change mode, `fuzz-seconds` per target, on pull requests when `fuzz` is true)
# Callers end checks.yml with the two alias jobs from the fleet standard (mattas-net/standards, private; ci-cd/ci-workflows) (`<job>` = the caller job
# that uses this workflow), so rulesets require exactly `checks` and `security` and a
# python-versions change never invalidates a ruleset:
#
#   checks:
#     needs: <job>
#     if: always()   # a skipped required check counts as passing, so always run and assert
#     runs-on: ubuntu-24.04
#     timeout-minutes: 5
#     steps:
#       - name: Require the shared checks job
#         env:
#           RESULT: ${{ needs.<job>.outputs.checks-result }}
#         run: test "$RESULT" = success
#   security:
#     (same, reading needs.<job>.outputs.security-result)
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the project (pyproject.toml), relative to the repo root; every command runs there.
        type: string
        default: .
      python-versions:
        description: JSON array of Python versions to test, e.g. '["3.12", "3.13"]'.
        type: string
        default: '["3.12"]'
      install:
        description: Command that installs the project with its dev tools (ruff, mypy, pytest, build).
        type: string
        default: python -m pip install --quiet -e ".[dev]"
      lint-paths:
        description: Paths passed to `ruff check` and `ruff format --check`.
        type: string
        default: .
      extra-lint:
        description: Extra lint commands run after ruff (e.g. `bandit -q -r src`); empty skips.
        type: string
        default: ""
      typecheck:
        description: Type-check command; empty skips.
        type: string
        default: python -m mypy
      typecheck-blocking:
        description: Fail the job on type errors (false only while a repo burns down its backlog).
        type: boolean
        default: true
      test:
        description: Test command.
        type: string
        default: python -m pytest -q
      extra-checks:
        description: Commands run after the tests (e.g. coverage floors); empty skips.
        type: string
        default: ""
      build:
        description: Build the sdist and wheel (`python -m build`, so `build` must be installed) and run `twine check` when twine is present.
        type: boolean
        default: true
      actionlint:
        description: Lint the repo's workflow files with actionlint.
        type: boolean
        default: true
      audit-install:
        description: Command that installs the dependencies for pip-audit. Install the project itself editable; pip-audit skips editable installs (an unreleased version is not on PyPI and would fail --strict).
        type: string
        default: python -m pip install --quiet -e ".[dev]"
      audit:
        description: pip-audit mode - strict (fail on findings), warn (report only) or off.
        type: string
        default: strict
      cache-dependency-path:
        description: Newline-separated globs hashed for the pip cache key (setup-python fails when none match).
        type: string
        default: |
          **/pyproject.toml
          **/requirements*.txt
      fuzz:
        description: On pull requests, run the caller's ClusterFuzzLite targets (.clusterfuzzlite/) in code-change mode; a crash fails security-result. The calling job must grant contents read and actions read.
        type: boolean
        default: false
      fuzz-seconds:
        description: Fuzzing seconds per target when fuzz is true (the job passes per-target x built targets to ClusterFuzzLite).
        type: number
        default: 600
    outputs:
      checks-result:
        description: '"success" when every python-versions leg of the checks job passed.'
        value: ${{ jobs.matrix-result.outputs.result }}
      security-result:
        description: '"success" when the security job passed, and fuzz too when it runs (fuzz true, pull_request).'
        value: >-
          ${{ jobs.security.outputs.result == 'success'
          && (!inputs.fuzz || github.event_name != 'pull_request' || jobs.fuzz.outputs.result == 'success')
          && 'success' || 'failure' }}

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install
        run: ${{ inputs.install }}

      - name: Lint (ruff)
        env:
          LINT_PATHS: ${{ inputs.lint-paths }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # LINT_PATHS is a space-separated path list
          ruff check $LINT_PATHS
          # shellcheck disable=SC2086
          ruff format --check $LINT_PATHS

      - name: Extra lint
        if: inputs.extra-lint != ''
        run: ${{ inputs.extra-lint }}

      - name: Lint workflows (actionlint)
        if: inputs.actionlint && strategy.job-index == 0
        working-directory: ${{ github.workspace }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's checksums.txt
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Type-check
        if: inputs.typecheck != ''
        continue-on-error: ${{ !inputs.typecheck-blocking }}
        run: ${{ inputs.typecheck }}

      - name: Test
        run: ${{ inputs.test }}

      - name: Extra checks
        if: inputs.extra-checks != ''
        run: ${{ inputs.extra-checks }}

      - name: Build
        if: inputs.build
        run: |
          set -euo pipefail
          python -m build
          if python -m twine --version >/dev/null 2>&1; then
            python -m twine check --strict dist/*
          fi

  # The checks job is a matrix, and a matrix job's step outputs are last-writer-wins: a passing
  # leg that finishes after a failed one would still report "success". needs.checks.result
  # aggregates every leg, so this job turns it into the checks-result output.
  matrix-result:
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.done.outputs.result }}
    steps:
      - name: Require every python-versions leg
        id: done
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          test "$RESULT" = success
          echo "result=success" >> "$GITHUB_OUTPUT"

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      result: ${{ steps.done.outputs.result }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review (vulnerable dependencies introduced by the PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Set up Python
        if: inputs.audit != 'off'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(inputs.python-versions)[0] }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install
        if: inputs.audit != 'off'
        run: |
          set -euo pipefail
          ${{ inputs.audit-install }}
          python -m pip install --quiet pip-audit==2.10.1

      - name: Audit installed dependencies (pip-audit)
        if: inputs.audit != 'off'
        continue-on-error: ${{ inputs.audit == 'warn' }}
        # Audit a frozen list that leaves out the editable project: --strict fails on
        # anything it cannot look up, and an unreleased version is not on PyPI.
        run: |
          set -euo pipefail
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/audit-requirements.txt"

      - name: Record result
        id: done
        run: echo "result=success" >> "$GITHUB_OUTPUT"

  # ClusterFuzzLite against the caller's .clusterfuzzlite/ (project.yaml, Dockerfile, build.sh),
  # on pull requests only. The actions clone the repository themselves with github-token (no
  # checkout step) and diff against the PR base for code-change mode. No SARIF upload.
  #
  # No permissions block, on purpose: a called job cannot be granted more than the calling job,
  # and GitHub checks that when it loads the workflow, even for a job its `if:` skips. Requesting
  # actions: read here would break every caller that does not fuzz. The job inherits the calling
  # job's token instead, so a caller with `fuzz: true` grants `contents: read` (clone) and
  # `actions: read` (earlier batch runs' corpus and build artifacts) on the calling job.
  fuzz:
    if: inputs.fuzz && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Hosted-runner maximum: the budget scales with the target count, which expressions cannot compute.
    timeout-minutes: 360
    outputs:
      result: ${{ steps.done.outputs.result }}
    steps:
      - name: Build fuzzers (address)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ github.token }}

      # run_fuzzers takes one total budget and splits it across the targets, so turn the per-target
      # input into a total, clamped to 19800 s (330 min). The count uses run_fuzzers' own discovery rule (oss-fuzz
      # infra/utils.py get_fuzz_targets / is_fuzz_target_local) over build-out: a file whose name,
      # minus an optional .exe, matches ^[A-Za-z0-9_-]+$ and is not jazzer_driver*, that is
      # executable, and that either ends in _fuzzer or is a regular file containing
      # LLVMFuzzerTestOneInput (compile_python_fuzzer's wrappers carry it as a comment).
      - name: Fuzz budget (fuzz-seconds per target x targets)
        id: budget
        shell: bash
        env:
          PER_TARGET: ${{ inputs.fuzz-seconds }}
        run: |
          set -euo pipefail
          if ! [[ "$PER_TARGET" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::fuzz-seconds must be a positive whole number of seconds (got '$PER_TARGET')"
            exit 1
          fi
          out="${GITHUB_WORKSPACE}/build-out"
          count=0
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            base="$name"; ext=""
            if [[ "$name" == ?*.* ]]; then base="${name%.*}"; ext=".${name##*.}"; fi
            [[ "$ext" == "" || "$ext" == ".exe" ]] || continue
            [[ "$base" =~ ^[A-Za-z0-9_-]+$ ]] || continue
            [[ "$base" != jazzer_driver* ]] || continue
            [ ! -d "$path" ] && [ -x "$path" ] || continue
            if [[ "$base" == *_fuzzer ]] || { [ -f "$path" ] && grep -qaF LLVMFuzzerTestOneInput "$path"; }; then
              echo "fuzz target: ${path#"$out"/}"
              count=$((count + 1))
            fi
          done < <(find "$out" \( -type f -o -type l \) -print0 2>/dev/null || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No fuzz targets found in build-out; check .clusterfuzzlite/build.sh"
            exit 1
          fi
          total=$((PER_TARGET * count))
          # Leave build and teardown headroom under the job's 360-minute timeout.
          max_total=19800
          if [ "$total" -gt "$max_total" ]; then
            echo "::warning::Fuzz budget clamped to ${max_total}s: requested ${PER_TARGET}s per target, effective $((max_total / count))s per target over $count targets"
            total=$max_total
          fi
          echo "$count targets, ${total}s total"
          echo "seconds=$total" >> "$GITHUB_OUTPUT"

      - name: Run fuzzers (code-change)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          mode: code-change
          fuzz-seconds: ${{ steps.budget.outputs.seconds }}
          github-token: ${{ github.token }}

      - name: Record result
        id: done
        run: echo "result=success" >> "$GITHUB_OUTPUT"
