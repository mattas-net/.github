name: Node checks (reusable)

# Lint, typecheck, test and audit a Node project. Each npm script runs only if
# it exists. Callers run this on push to main (automatic) and on
# workflow_dispatch (manual, for PR branches). docker-build-push.yml also
# calls it as its verify job.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node major (match the Dockerfile base).
        type: string
        default: "22"
      npm-ci-args:
        description: Extra flags for npm ci.
        type: string
        default: "--ignore-scripts"
      audit-level:
        description: Minimum severity that fails npm audit and, on PRs, dependency review (production dependencies only).
        type: string
        default: high

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci ${{ inputs.npm-ci-args }}

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      # Same model as python-ci.yml: every run audits the whole tree, so a high CVE
      # on main fails Checks and blocks create-release.yml; a PR also gets dependency
      # review of what it introduces.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}

      - name: Dependency review (vulnerable dependencies introduced by the PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.audit-level }}
          fail-on-scopes: runtime
