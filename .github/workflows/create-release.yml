name: Create Release (reusable)

# Shared release entry point. The caller is a workflow_dispatch that takes a
# `version` input and passes it here. This workflow:
#   1. validates the version is bare semver (1.4.2 or 1.4.2-beta1, never v1.4.2),
#   2. checks out main and refuses to continue unless the manifest on main
#      already carries exactly that version (bump it, merge, re-run); see the
#      verify step for the lookup per manifest type (.json, .toml, .yml/.yaml,
#      .properties),
#   3. refuses if the tag (or a legacy v-tag) already exists,
#   4. optionally requires the named check workflow to have succeeded on main HEAD,
#   5. tags main HEAD, pushes the tag, and creates the GitHub Release
#      (pre-release when the version has a hyphen suffix) with the notes from
#      `notes-file` when that file exists at the tag, else generated notes.
# Nothing is tagged if any check fails, so the run can simply be repeated.
# dry-run: true runs every check and creates the tag locally, then prints the
# push and the release it would create instead of doing them. The outputs are
# still set, so a caller skips its build jobs when it passes dry-run.
#
# A release created with GITHUB_TOKEN does not fire `release:` events in other
# workflows; callers chain the build job after this one (needs:) instead.
on:
  workflow_call:
    inputs:
      version:
        description: Bare semver to release, e.g. 1.4.2 or 1.4.2-beta1.
        type: string
        required: true
      manifest:
        description: Path to the file that holds the version (package.json, pyproject.toml, manifest.json, Cargo.toml, an XcodeGen project.yml, gradle.properties).
        type: string
        required: true
      manifest-key:
        description: Key to read from a .yml/.yaml or .properties manifest (defaults MARKETING_VERSION and version). Ignored for .json/.toml.
        type: string
        default: ""
      require-workflow:
        description: Name of a check workflow that must have succeeded on main HEAD (empty to skip).
        type: string
        default: ""
      title-prefix:
        description: Text placed before the version in the release title (defaults to the repo name).
        type: string
        default: ""
      dry-run:
        description: Run every check and tag locally, but print instead of pushing the tag and creating the release.
        type: boolean
        default: false
      notes-file:
        description: Repo path of a release-notes file; when it exists at the tag it is passed as --notes-file, else notes are generated.
        type: string
        default: ""
    outputs:
      tag:
        description: The tag that was created (equals the version input).
        value: ${{ jobs.release.outputs.tag }}
      prerelease:
        description: Set to "true" when the version has a pre-release suffix.
        value: ${{ jobs.release.outputs.prerelease }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the tag, create the release
      actions: read # look up check-workflow runs
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}

    steps:
      - name: Validate version format
        id: vars
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not bare semver (X.Y.Z or X.Y.Z-suffix; no v prefix)"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # Version lookup by manifest type:
      #   .json        .version
      #   .toml        [project], [package], [tool.poetry] or [workspace.package] version (first found)
      #   .yml/.yaml   every `<key>:` line at any indentation (top level or nested under
      #                settings/targets), key default MARKETING_VERSION; all occurrences
      #                must agree. App Store versions are numeric, so a pre-release
      #                version (1.4.2-beta1) matches a manifest holding its X.Y.Z (1.4.2).
      #   .properties  the `<key>=` line, key default version (e.g. wjm.versionName). Like the
      #                iOS manifest it holds X.Y.Z: the Android versionName drops the suffix,
      #                so a pre-release (1.4.2-beta1) matches 1.4.2.
      - name: Verify the manifest on main carries this version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MANIFEST: ${{ inputs.manifest }}
          MANIFEST_KEY: ${{ inputs.manifest-key }}
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest '$MANIFEST' not found on main"
            exit 1
          fi
          expected="$VERSION"
          case "$MANIFEST" in
            *.yml|*.yaml)
              key="${MANIFEST_KEY:-MARKETING_VERSION}"
              values="$(sed -nE "s/^[[:space:]]*${key//./\\.}:[[:space:]]*[\"']?([^\"'#[:space:]]+)[\"']?[[:space:]]*(#.*)?$/\1/p" "$MANIFEST" | sort -u)"
              if [ "$(printf '%s' "$values" | grep -c . || true)" -gt 1 ]; then
                echo "::error::$MANIFEST declares different ${key} values: $(echo "$values" | tr '\n' ' ')"
                exit 1
              fi
              found="$values"
              expected="${VERSION%%-*}" ;;
            *.properties)
              key="${MANIFEST_KEY:-version}"
              found="$(sed -nE "s/^[[:space:]]*${key//./\\.}[[:space:]]*[=:][[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p" "$MANIFEST" | tail -n 1)"
              expected="${VERSION%%-*}" ;;
            *.json)
              found="$(jq -r '.version // empty' "$MANIFEST")" ;;
            *.toml)
              found="$(python3 - "$MANIFEST" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          for key in ("project", "package", "tool.poetry", "workspace.package"):
              node = data
              for part in key.split("."):
                  node = node.get(part, {}) if isinstance(node, dict) else {}
              if isinstance(node, dict) and "version" in node:
                  print(node["version"])
                  break
          PY
          )" ;;
            *)
              echo "::error::Unsupported manifest type '$MANIFEST' (expected .json, .toml, .yml/.yaml or .properties)"
              exit 1 ;;
          esac
          if [ -z "$found" ]; then
            echo "::error::No version field found in $MANIFEST"
            exit 1
          fi
          if [ "$found" != "$expected" ]; then
            echo "::error::$MANIFEST on main is $found, not $expected. Bump it, merge to main, then re-run."
            exit 1
          fi
          echo "$MANIFEST on main is $found"

      - name: Refuse an existing tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for t in "$VERSION" "v$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::error::Tag $t already exists at $(git rev-parse "refs/tags/$t^{commit}")"
              exit 1
            fi
          done

      - name: Require the check workflow to have passed on main HEAD
        if: inputs.require-workflow != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.require-workflow }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --commit "$sha" --status success --limit 1 --json databaseId --jq 'length')"
          if [ "$n" = "0" ]; then
            echo "::error::No successful '$WORKFLOW' run for main HEAD $sha. Run it (or wait for it) and re-run this workflow."
            exit 1
          fi
          echo "'$WORKFLOW' succeeded on $sha"

      - name: Tag main HEAD
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push refs/tags/$VERSION ($(git rev-parse HEAD)) to origin"
          else
            git push origin "refs/tags/$VERSION"
            echo "Tagged $(git rev-parse HEAD) as $VERSION"
          fi

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
          TITLE_PREFIX: ${{ inputs.title-prefix }}
          DRY_RUN: ${{ inputs.dry-run }}
          NOTES_FILE: ${{ inputs.notes-file }}
        run: |
          set -euo pipefail
          prefix="${TITLE_PREFIX:-${GITHUB_REPOSITORY#*/}}"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$prefix $VERSION")
          # The notes file is read from the tag itself, so it is the reviewed copy on main.
          if [ -n "$NOTES_FILE" ] && git cat-file -e "refs/tags/${VERSION}:${NOTES_FILE}" 2>/dev/null; then
            git show "refs/tags/${VERSION}:${NOTES_FILE}" > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
            echo "Release notes from $NOTES_FILE"
          else
            if [ -n "$NOTES_FILE" ]; then
              echo "::notice::$NOTES_FILE is not in $VERSION; generating release notes"
            fi
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would run gh release create $VERSION ${args[*]}"
            if [ -f "$RUNNER_TEMP/release-notes.md" ]; then
              echo "--- release notes ---"
              cat "$RUNNER_TEMP/release-notes.md"
            fi
            exit 0
          fi
          gh release create "$VERSION" "${args[@]}"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
