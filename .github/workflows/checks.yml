name: Checks

# Checks for this repository's own workflows: actionlint over .github/workflows, and a
# self-test that runs python-ci, node-ci, rust-ci and docs (dry run) from this ref against
# the fixtures under tests/fixtures/<class>/, so a broken reusable fails here before callers
# pick it up from @main. Local `uses: ./...` paths resolve to the commit under test.
# Runs automatically on push to main; on pull requests the run waits at the `approve` job
# (no runner minutes) until a required reviewer approves it in the `approval` environment.
# A manually dispatched run does not attach to a PR, so it cannot satisfy the gate.
# Required checks (default-branch ruleset): "actionlint" and "self-test".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  actionlint:
    needs: approve
    # always(): a rejected or cancelled approval must fail this required check, not skip it (a skipped required check counts as passing).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's checksums.txt
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Require approval
        if: needs.approve.result == 'failure' || needs.approve.result == 'cancelled'
        run: |
          echo "::error::Checks were not approved"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  # A job's `uses:` cannot come from a matrix, so each reusable gets its own job; the
  # self-test job below is the one required check that asserts all of them.
  self-test-python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python
      python-versions: '["3.13"]'
      actionlint: false
      cache-dependency-path: tests/fixtures/python/pyproject.toml

  self-test-node:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/node
      node-version: "24"

  self-test-rust:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/rust-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/rust

  self-test-docs:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/docs.yml
    # docs.yml's job requests contents: write for its publish mode, and a called job cannot be
    # granted more than its caller; with dry-run it checks out, builds and pushes nothing.
    permissions:
      contents: write
    with:
      working-directory: tests/fixtures/docs
      dry-run: true

  self-test:
    needs: [approve, self-test-python, self-test-node, self-test-rust, self-test-docs]
    # always(): a rejected approval or a failed reusable must fail this required check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every reusable to pass on its fixture
        env:
          PYTHON_CHECKS: ${{ needs.self-test-python.outputs.checks-result }}
          PYTHON_SECURITY: ${{ needs.self-test-python.outputs.security-result }}
          NODE_CHECKS: ${{ needs.self-test-node.outputs.checks-result }}
          NODE_SECURITY: ${{ needs.self-test-node.outputs.security-result }}
          RUST_CHECKS: ${{ needs.self-test-rust.outputs.checks-result }}
          RUST_SECURITY: ${{ needs.self-test-rust.outputs.security-result }}
          DOCS: ${{ needs.self-test-docs.result }}
        run: |
          status=0
          for name in PYTHON_CHECKS PYTHON_SECURITY NODE_CHECKS NODE_SECURITY RUST_CHECKS RUST_SECURITY DOCS; do
            value="${!name}"
            echo "$name=${value:-<empty>}"
            if [ "$value" != success ]; then status=1; fi
          done
          exit "$status"
