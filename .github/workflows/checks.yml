name: Checks

# Checks for this repository's own workflows: actionlint over .github/workflows, and a
# self-test that runs python-ci, node-ci, rust-ci, infra-ci, docs (dry run), create-release
# (dry run) and docker-build-push (no push) from this ref against the fixtures under
# tests/fixtures/<class>/, plus a parse-only check of ios-release and android-release, so a broken
# reusable fails here before callers pick it up from @main. Not self-tested (see README): ios-ci
# (no Swift fixture; macOS runners), android-ci, hacs-ci and python-build (no working-directory
# input), and the release signing paths. Local `uses: ./...` paths resolve to the commit under test.
# Runs automatically on push to main; on pull requests the run waits at the `approve` job
# (no runner minutes) until a required reviewer approves it in the `approval` environment.
# A manually dispatched run does not attach to a PR, so it cannot satisfy the gate.
# Required checks (org ruleset): "checks" and "security"; the aliases at the bottom assert actionlint, the
# self-test and the self-test security results.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  actionlint:
    needs: approve
    # always(): a rejected or cancelled approval must fail this required check, not skip it (a skipped required check counts as passing).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's checksums.txt
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Require approval
        if: needs.approve.result == 'failure' || needs.approve.result == 'cancelled'
        run: |
          echo "::error::Checks were not approved"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  # A job's `uses:` cannot come from a matrix, so each reusable gets its own job; the
  # self-test job below is the one required check that asserts all of them.
  self-test-python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python
      python-versions: '["3.13"]'
      actionlint: false
      cache-dependency-path: tests/fixtures/python/pyproject.toml

  self-test-node:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/node
      node-version: "24"

  self-test-rust:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/rust-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/rust

  self-test-docs:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/docs.yml
    # docs.yml's job requests contents: write for its publish mode, and a called job cannot be
    # granted more than its caller; with dry-run it checks out, builds and pushes nothing.
    permissions:
      contents: write
    with:
      working-directory: tests/fixtures/docs
      dry-run: true

  self-test-infra:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/infra-ci.yml
    permissions:
      contents: read
    with:
      terraform-dirs: tests/fixtures/infra/terraform
      helm-dirs: tests/fixtures/infra/helm

  # create-release checks out main and reads the manifest from there, so the fixture manifest
  # must already be on main: tests/fixtures/node/package.json (version 0.0.0, no such tag).
  self-test-create-release:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/create-release.yml
    permissions:
      contents: write
      actions: read
    with:
      version: 0.0.0
      manifest: tests/fixtures/node/package.json
      dry-run: true

  self-test-docker:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: ./.github/workflows/docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      verify: false
      push: false
      image-tag: selftest
      context: tests/fixtures/docker
      file: tests/fixtures/docker/Dockerfile

  # The signed release workflows need secrets, so they are only parsed: the on.workflow_call
  # block must exist (actionlint above covers syntax and expressions).
  self-test-release-parse:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert on.workflow_call in ios-release and android-release
        run: |
          set -euo pipefail
          for f in ios-release android-release; do
            yq -e '.on.workflow_call.inputs' ".github/workflows/${f}.yml" > /dev/null
            yq -e '.on.workflow_call.secrets' ".github/workflows/${f}.yml" > /dev/null
            echo "$f: workflow_call block present"
          done

  self-test:
    needs: [approve, self-test-python, self-test-node, self-test-rust, self-test-docs, self-test-infra, self-test-create-release, self-test-docker, self-test-release-parse]
    # always(): a rejected approval or a failed reusable must fail this required check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every reusable to pass on its fixture
        env:
          PYTHON_CHECKS: ${{ needs.self-test-python.outputs.checks-result }}
          PYTHON_SECURITY: ${{ needs.self-test-python.outputs.security-result }}
          NODE_CHECKS: ${{ needs.self-test-node.outputs.checks-result }}
          NODE_SECURITY: ${{ needs.self-test-node.outputs.security-result }}
          RUST_CHECKS: ${{ needs.self-test-rust.outputs.checks-result }}
          RUST_SECURITY: ${{ needs.self-test-rust.outputs.security-result }}
          DOCS: ${{ needs.self-test-docs.result }}
          INFRA_CHECKS: ${{ needs.self-test-infra.outputs.checks-result }}
          INFRA_SECURITY: ${{ needs.self-test-infra.outputs.security-result }}
          CREATE_RELEASE: ${{ needs.self-test-create-release.result }}
          DOCKER: ${{ needs.self-test-docker.result }}
          RELEASE_PARSE: ${{ needs.self-test-release-parse.result }}
        run: |
          status=0
          for name in PYTHON_CHECKS PYTHON_SECURITY NODE_CHECKS NODE_SECURITY RUST_CHECKS RUST_SECURITY DOCS INFRA_CHECKS INFRA_SECURITY CREATE_RELEASE DOCKER RELEASE_PARSE; do
            value="${!name}"
            echo "$name=${value:-<empty>}"
            if [ "$value" != success ]; then status=1; fi
          done
          exit "$status"

  checks:
    needs: [approve, actionlint, self-test]
    if: always()   # a skipped required check counts as passing, so always run and assert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require actionlint and the self-test
        env:
          APPROVE: ${{ needs.approve.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          SELF_TEST: ${{ needs.self-test.result }}
        run: |
          # approve is skipped (not failed) on push and dispatch runs
          if [ "$APPROVE" = failure ] || [ "$APPROVE" = cancelled ]; then exit 1; fi
          test "$ACTIONLINT" = success
          test "$SELF_TEST" = success

  security:
    needs: [self-test-python, self-test-node, self-test-rust, self-test-infra]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the self-test security jobs
        env:
          PYTHON: ${{ needs.self-test-python.outputs.security-result }}
          NODE: ${{ needs.self-test-node.outputs.security-result }}
          RUST: ${{ needs.self-test-rust.outputs.security-result }}
          INFRA: ${{ needs.self-test-infra.outputs.security-result }}
        run: |
          test "$PYTHON" = success
          test "$NODE" = success
          test "$RUST" = success
          test "$INFRA" = success
