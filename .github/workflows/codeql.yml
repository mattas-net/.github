name: CodeQL (reusable)

# CodeQL analysis for repos that do not use CodeQL default setup (the two
# cannot both upload). Kept out of python-ci.yml because GitHub checks a nested
# job's permissions before evaluating its `if:`, so an opt-in job there would
# force every caller to grant security-events: write.
#
# Check context: `<caller job> / analyze`.
on:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL languages.
        type: string
        default: python

# Actions are pinned by commit SHA; the comment names the tag each SHA was resolved from.
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.languages }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
